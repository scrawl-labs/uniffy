<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="카메라로 찍으면 lb, °F, inch 같은 단위를 바로 kg, °C, cm로 바꿔주는 렌즈" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>uniffy</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">uniffy</div>
        <div class="chips">
          <button id="target-chip" class="chip" type="button" aria-label="변환 방향"></button>
          <button id="assume-chip" class="chip" type="button" aria-label="숫자만 있을 때 단위"></button>
        </div>
      </header>

      <main id="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="shot" hidden></canvas>
        <div id="camera-msg" class="center-msg" hidden></div>
        <div id="status" class="status" hidden></div>
      </main>

      <section id="sheet" class="sheet" hidden>
        <div class="sheet-handle"></div>
        <div id="summary" class="summary"></div>
        <ul id="results" class="results"></ul>
        <p id="empty" class="empty" hidden>
          단위를 못 찾았어요. 숫자가 화면에 크고 선명하게 나오게 다시 찍어보세요.
          원판에 숫자만 있으면 위의 <b>숫자만</b> 칩을 lb로 바꿔보세요.
        </p>
      </section>

      <footer class="controls">
        <label class="round-btn" aria-label="사진 불러오기">
          <input id="file" type="file" accept="image/*" hidden />
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19 5v14H5V5h14m0-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm-4.86 8.86-3 3.87L9 13.14 6 17h12l-3.86-5.14Z"/></svg>
        </label>
        <button id="shutter" class="shutter" type="button" aria-label="찍어서 변환"><span></span></button>
        <button id="retake" class="round-btn" type="button" aria-label="다시 찍기" disabled>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
        </button>
      </footer>

      <form id="manual" class="manual" autocomplete="off">
        <input id="manual-input" type="text" inputmode="text" placeholder="직접 입력: 225 lb, 350°F, 5'11&quot;" />
        <output id="manual-out"></output>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
